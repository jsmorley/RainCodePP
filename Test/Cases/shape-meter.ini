[MeterShape]
Meter=Shape
Shape=Rectangle (10 | 1),0,100,100 | Fill Color FF0080 | Stroke Color 255,255,255,128
Shape2=Ellipse 10,10,5 | StrokeWidth 2 | StrokeStartCap Round | StrokeEndCap Triangle | StrokeDashCap Flat
Shape3=Line 0,0,100,100 | StrokeDashes 2,1.5 | StrokeDashOffset 1 | StrokeLineJoin MiterOrBevel,10
Shape4=Arc 0,0,100,100,*,*,*,*,*,1 | Rotate 45 | Scale 1.5,0 | Skew -20,0 | Offset 10,0
Shape5=Curve 0,0,50,50,60,60,0 | TransformOrder Scale,Rotate,Skew,Offset
Shape6=Path Track | Extend Finish, Shared Finish
Shape7=Path1 OtherTrack | Fill LinearGradient1 Pink | Stroke RadialGradient1 Chalk
Shape8=Combine Shape | Union Shape2 | XOR Shape3 | Intersect Shape4 | Exclude Shape5
Track=0,0 | LineTo 20,20 | ArcTo 30,0 | CurveTo 0,0,10,10 | SetNoStroke 1 | SetRoundJoin 0 | ClosePath 1
Finish=Fill Color 1,2,3 | StrokeWidth 4 | StrokeLineJoin Miter,2 | Extend Shared Finish
Shared Finish=TransformOrder Rotate,Scale | Fill LinearGradient Pink | Stroke RadialGradient Chalk
Pink=180 | 255,0,0,255 ; 0.0 | 00FF00 ; 0.5 | [#Accent] ; 1.0
Chalk=0,0,20,20 | 155,200,232,255 ; 0.0 | 6,46,75,255 ; 1.0
Shape9=NotAShape 1,2
Text=Fill Color 1,2,3 | Rotate 45
[Variables]
Raw=Fill Color 1,2,3
