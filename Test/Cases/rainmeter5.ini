[Rainmeter]
SyntaxVersion=2
@Include2=[#@]Includes\Common.inc
[Variables]
Text=Leave user-defined key names alone
Accent=167B99
colorBar=235,170,0,255
colorText=255,255,255,205
LabelColor2="FF8020C8"
windowBounds=235,170,0,255
[MeterCaption]
Meter=String
MeasureName2=MeasureCounter
Text=%1 [MeasureCounter:MaxValue:/1024,2] [&MeterCaption:XW] [%APPDATA] [#Label[&MeasureCounter]] [$Display2WorkAreaPhysicalW]
W=(clamp(sin(pi / 3) * 2.5e2, 0x20, 0b1100) + $SkinW)
X=10R
Y=-2 r
x=(max(12, #Padding#))r
Y="[#Offset]R"
H=10R
IfCondition=(#Active# = 1) && (MeasureCounter >= 5)
SolidColor=4E549AFF
FontColor=255, 128, 32, 200
SolidColor2=(max(16,32)),#Green#,32,200
ImageTint=0xFF8020
Padding=1,2,3,4
InlineSetting2=Color | FEBA90
InlineSetting3=Color | 255,128,32,200
Shape=Rectangle 0,0,20,20 | Fill Color 526EA8 | StrokeWidth 2 | StrokeLineJoin Round
Shape2=Rectangle 0,0,20,20 | Fill Color 255,128,32 | Stroke Color 000020C8
OnRefreshAction=[!SetOption MeterCaption FontColor "255,128,32,200"]
OnChangeAction=[!SetOption MeterCaption Y "10r"][!SetOption MeterCaption X "(8 + 2)R"]
OnMouseOverAction=[!SetVariable colorBar "235,170,0,255"]
OnLeaveAction=[!SetOption MeterCaption Text "[@LocationAdminDistrict]"]
Coordinates=0,0 | LineTo 15,15 | ClosePath 1
Flags=ForceReload | NoCookies | Resync
OnUpdateAction=[!Skin:SetOption "A\B" MeterCaption StringAlign "LeftBottom"][!SetOption MeterCaption W "(max([&Counter:%, 2], 10) * $SkinW)"][!UpdateMeter MeterCaption]
OnClickAction=[!SetOption MeterCaption Text """Literal ] and [#Accent], then [!Redraw]"""][!WriteKeyValue Rainmeter SyntaxVersion 2]
OnCommand=[!CommandMeasure MeasureScript "Animate([#Speed], 'quoted text')"]
Text2=[&MeasureScript:Metric([&Other], 'x')] [#*Unexpanded*] [\x41]
String=[@LocationAdminDistrict] [@MeterCaption:XW]
Format="%Y-%m-%d %#d"
RegExp=(^[A-Z]+|[0-9]{2}|[@a-z]+$)

