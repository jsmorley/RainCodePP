!Skin:Load Config
!Skin:Load Config File
!Skin:Unload Config
[!Skin:Unload *]
!Skin:Toggle Config File
!Skin:Edit Config File
[!Skin:Move "illustro\Clock" 100 200]
[!Skin:Hide "Group=Widgets"]
[!TextEdit:SetText InputField "New text"]
[!TextEdit:Clear "Group=Inputs"]
OnSubmitAction=[!TextEdit:Clear]
[!Skin:TextEdit:SetText "MySuite\Input" InputField "New text"]
[!Refresh][!Redraw]
[Rainmeter]
OnRefreshAction=[!Skin:Load Config][!Skin:Load Config File][!Skin:Unload Config]
OnUpdateAction=[!Skin:Unload *][!Skin:Toggle Config File][!Skin:Edit Config File]
LeftMouseUpAction=[!Skin:Move "illustro\Clock" 100 200][!Skin:Hide "Group=Widgets"]
RightMouseUpAction=!Skin:Load Config
MiddleMouseUpAction=[!Skin:Quit]
[Variables]
Text=TextEdit
[MeterInput]
Meter=TextEdit
OnSubmitAction=[!TextEdit:SetText "Text for this meter"]
OnFocusAction=[!TextEdit:SetText InputField "New text"][!TextEdit:Clear "Group=Inputs"]
OnUnfocusAction=[!Skin:TextEdit:SetText "MySuite\Input" InputField "New text"]
