[Variables]
BaseUrl=HTTPS://example.test/v1/#City#/%20#section
[MeasureWeb]
Measure=WebParser
URL=https://[2001:db8::1]/p%AB%2F?q=[@City:EncodeURL]&units=#Units#
URL="file://#@#Example Folder/Example.txt"
URL=[MeasureParent]
URL=[&BaseAddress]/#Path#?id=7
URL=https://example.test/%APPDATA%/$SkinW
LeftMouseUpAction=["https://example.test/#City#"][!Redraw]
RightMouseUpAction=[!SetOption MeasureWeb URL "https://example.test/[$SkinW]?q=[#Query]"]
Text=Read http://example.test/Film_(Title), then mailto:hello@example.test.
RegExp=https://example\.test/.*$
